<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradMotion Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
  h1 { font-size: 24px; margin-bottom: 20px; }
  .status-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card { background: #1e293b; border-radius: 8px; padding: 16px 24px; min-width: 120px; text-align: center; }
  .stat-card .num { font-size: 32px; font-weight: 700; }
  .stat-card .label { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  .stat-card.pending .num { color: #f59e0b; }
  .stat-card.running .num { color: #3b82f6; }
  .stat-card.completed .num { color: #22c55e; }
  .stat-card.failed .num { color: #ef4444; }
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
  th, td { padding: 12px 16px; text-align: left; font-size: 14px; }
  th { background: #334155; color: #94a3b8; font-weight: 600; }
  tr { border-bottom: 1px solid #334155; }
  tr:last-child { border-bottom: none; }
  tr:hover { background: #334155; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-pending { background: #78350f; color: #fbbf24; }
  .badge-assigned { background: #1e3a5f; color: #60a5fa; }
  .badge-running { background: #1e3a5f; color: #60a5fa; }
  .badge-completed { background: #14532d; color: #4ade80; }
  .badge-failed { background: #7f1d1d; color: #fca5a5; }
  .refresh { color: #94a3b8; font-size: 13px; margin-bottom: 12px; }
  .empty { text-align: center; padding: 48px; color: #64748b; }
  .link { color: #60a5fa; text-decoration: none; }
  .link:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>GradMotion Dashboard</h1>

<div class="status-bar">
  <div class="stat-card pending"><div class="num" id="cnt-pending">0</div><div class="label">PENDING</div></div>
  <div class="stat-card running"><div class="num" id="cnt-running">0</div><div class="label">RUNNING</div></div>
  <div class="stat-card completed"><div class="num" id="cnt-completed">0</div><div class="label">COMPLETED</div></div>
  <div class="stat-card failed"><div class="num" id="cnt-failed">0</div><div class="label">FAILED</div></div>
</div>

<div class="refresh">每 10 秒自动刷新 | 上次刷新: <span id="last-refresh">--</span></div>

<table>
  <thead>
    <tr>
      <th>任务 ID</th>
      <th>状态</th>
      <th>仓库</th>
      <th>Commit</th>
      <th>Agent</th>
      <th>创建时间</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody id="job-list">
    <tr><td colspan="7" class="empty">加载中...</td></tr>
  </tbody>
</table>

<script>
const API = '';

function badgeClass(status) {
  const map = { PENDING: 'badge-pending', ASSIGNED: 'badge-assigned', RUNNING: 'badge-running', COMPLETED: 'badge-completed', FAILED: 'badge-failed' };
  return map[status] || '';
}

async function fetchJobs() {
  try {
    const resp = await fetch(API + '/jobs?limit=100');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const allJobs = await resp.json();

    // 统计
    const counts = { PENDING: 0, ASSIGNED: 0, RUNNING: 0, COMPLETED: 0, FAILED: 0 };
    allJobs.forEach(j => { if (counts[j.status] !== undefined) counts[j.status]++; });
    document.getElementById('cnt-pending').textContent = counts.PENDING;
    document.getElementById('cnt-running').textContent = counts.RUNNING + counts.ASSIGNED;
    document.getElementById('cnt-completed').textContent = counts.COMPLETED;
    document.getElementById('cnt-failed').textContent = counts.FAILED;

    // 渲染表格
    const tbody = document.getElementById('job-list');
    if (allJobs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无任务</td></tr>';
    } else {
      tbody.innerHTML = allJobs.map(j => `
        <tr>
          <td><code>${j.id.substring(0, 8)}...</code></td>
          <td><span class="badge ${badgeClass(j.status)}">${j.status}</span></td>
          <td><a class="link" href="${j.repo_url}" target="_blank">${j.repo_url.split('/').slice(-1)[0]}</a></td>
          <td><code>${j.commit_sha.substring(0, 7)}</code></td>
          <td>${j.agent_id || '--'}</td>
          <td>${j.create_time ? new Date(j.create_time).toLocaleString() : '--'}</td>
          <td><a class="link" href="/jobs/${j.id}/checkpoint/best_model.pt">下载模型</a></td>
        </tr>
      `).join('');
    }

    document.getElementById('last-refresh').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('job-list').innerHTML = '<tr><td colspan="7" class="empty">加载失败: ' + e.message + '</td></tr>';
  }
}

fetchJobs();
setInterval(fetchJobs, 10000);
</script>
</body>
</html>
