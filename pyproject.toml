[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nettrainbridge"
version = "0.1.0"
description = "Distributed RL training bridge: webhook → cloud server → training agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ntb = "nettrainbridge_cli.main:main"

[tool.setuptools.packages.find]
where = [".", "cli"]
include = ["nettrainbridge_common*", "nettrainbridge_cli*"]

[tool.setuptools.package-data]
nettrainbridge_common = ["config.example.json"]
